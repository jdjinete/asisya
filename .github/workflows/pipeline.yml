name: Asisya CI/CD Enterprise Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-ci:
    name: Backend CI (.NET 8 Clean Architecture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore backend/Asisya.sln

      - name: Compile Backend Solution
        run: dotnet build backend/Asisya.sln --no-restore --configuration Release

      - name: Execute Automated Unit Tests (xUnit)
        run: dotnet test backend/Asisya.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  frontend-ci:
    name: Frontend CI (React 18 SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Code Quality & Linting
        run: npm run lint

      - name: Build Production Web Bundle
        run: npm run build

  docker-verification:
    name: Docker Containerization Build Validation
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: asisya-api:test

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: asisya-frontend:test
